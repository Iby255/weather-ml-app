- name: A playbook to install and start minikube on the Production Server
  hosts: localhost
  user: ubuntu
  become: yes

  vars:
    minikubeVersion: v1.39.0

  tasks:

  - name: 1. Download the minikube binary
    shell:
      cmd: curl -fsSL -o /tmp/minikube "https://github.com/kubernetes/minikube/releases/download/{{ minikubeVersion }}/minikube-linux-amd64"

  - name: 2. Copy minikube to the folder for programs
    copy:
      src: /tmp/minikube
      dest: /usr/local/bin/minikube

  - name: 3. Change file permissions so that it can be executed
    file:
      path: /usr/local/bin/minikube
      owner: root
      group: root
      mode: '755'

  - name: 4. Start minikube with the Docker driver
    become: no
    shell:
      cmd: minikube start --driver=docker

  - name: 5. Check that minikube is running
    become: no
    shell:
      cmd: minikube status
