- name: A playbook to install kubectl on the Production Server
  hosts: localhost
  user: ubuntu
  become: yes

  vars:
    kubectlVersion: v1.37.2

  tasks:

  - name: 1. Download the kubectl binary
    shell:
      cmd: curl -fsSL -o /tmp/kubectl "https://dl.k8s.io/release/{{ kubectlVersion }}/bin/linux/amd64/kubectl"

  - name: 2. Copy kubectl to the folder for programs
    copy:
      src: /tmp/kubectl
      dest: /usr/local/bin/kubectl

  - name: 3. Change file permissions so that it can be executed
    file:
      path: /usr/local/bin/kubectl
      owner: root
      group: root
      mode: '755'

  - name: 4. Check that kubectl runs
    become: no
    shell:
      cmd: kubectl version --client
